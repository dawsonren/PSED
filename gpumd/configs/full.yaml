# paths (relative to gpumd/ root)
nep_model: potentials/Si_GAP_nep.txt
gpumd_exec: /home/djr2473/exec/gpumd

# Base dir for all results. Kept off the quota-limited home directory so bulk
# GPUMD output (model.xyz ~20 MB/run, movie/velocity dumps) cannot exceed quota
# mid-write and silently truncate. Omit this key to default to gpumd/results.
results_dir: /projects/p33174/PSED_results

# use calorine flag
use_calorine: true

# GB generation parameters
gb_generation:
  # control simulation box size (MD has heat flow over z-axis)
  x_nm: 2.5
  y_nm: 2.5
  z_nm: 200.0
  timestep_fs: 1.0
  # control replications
  n_runs: 3
  # control initial npt
  npt_start:
    t_start: 10
    t_end: 675
    tau_t: 100.0
    pressure_gpa: 0
    bulk_modulus_gpa: 100
    tau_p: 1000
    total_time_ps: 100.0
  nvt_anneal:
    t_start: []
    t_end: []
    tau_t: 100.0
    total_time_ps: []
    gb_margin_nm: 8
  nvt:
    t_start: 675
    t_end: 675
    tau_t: 100.0         
    total_time_ps: 15.0
  npt:
    t_start: 675
    t_end: 675
    tau_t: 100.0       
    pressure_gpa: 0        
    bulk_modulus_gpa: 100.0  
    tau_p: 1000 
    total_time_ps: 15.0
  # control debugging plots (can be slow) and intermediate structure dumps
  optimize: false
  debug: true
  dump_interval: 50000

# RNEMD parameters
rnemd:
  # control rnemd setup
  nbins: 200                # must be even (symmetric PBC paths)
  # control simulation length, total steps = n_cycles * steps_per_cycle
  timestep_fs: 2
  n_warmup_cycles: 400          # warmup cycles to build gradient before recording data
  n_cycles: 800                  # number of production cycles (velocity swaps after each)
  steps_per_cycle: 1000           # controls the frequency of velocity swaps
  # control replications
  n_runs: 5                # independent rNEMD simulations per structure (for uncertainty)
  # control simulation parameters
  ensemble: "nvt"
  tau_t: 100
  temperature_k: 675
  # control debugging plots (can be slow)
  debug_structure: false
  debug_diagnostics: true
  include_movie: false
  debug_animation: true   # save temperature_profile.mp4 (one line per frame)

# ML dataset parameters (format_cleaned_data.py)
ml:
  # atom subsets: descriptors computed for all atoms plus atoms within each
  # of these distances (Å) of a GB plane
  gb_dist_thresholds: [10.0]
  # structural descriptor settings
  bond_cutoff: 3.0          # Å, first-shell cutoff for Si bonds/angles/dihedrals
  rdf_cutoff: 10.0          # Å, RDF integration range
  rdf_nbins: 200
  dihedral_nbins: 36
  # GB-energy relaxation (CPUNEP + LBFGS) force convergence [eV/Å]
  relax_fmax: 0.01

